name: Deploy Hong Kong staging

on:
  push:
    branches: [prepare-hk-independent-backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psyc-thesis-hk-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: standalone/package-lock.json
      - name: Install and validate
        run: |
          npm ci --prefix standalone --no-audit --no-fund
          npm --prefix standalone test
          npm --prefix standalone run typecheck
          node tests/protocol.test.mjs
          node tests/server.test.mjs
          node tests/migration.test.mjs
          node tests/staging-deploy.test.mjs
      - name: Deploy isolated staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/deploy-hk-staging.mjs
